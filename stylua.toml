#:schema https://www.schemastore.org/stylua.json

syntax = "LuaJIT"
column_width = 120
indent_type = "Spaces"
indent_width = 4
line_endings = "Unix"
quote_style = "AutoPreferDouble"
call_parentheses = "NoSingleTable"
collapse_simple_statement = "Never"
space_after_function_names = "Never"

[sort_requires]
enabled = true
