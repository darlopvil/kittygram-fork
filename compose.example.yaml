# Copy to docker-compose.yml (ignored by git) and adapt it to your setup.
services:
  kittygram:
    build: .
    image: kittygram-fork
    container_name: kittygram
    restart: unless-stopped
    depends_on:
      - redis
    ports:
      - 8080:80
    volumes:
      - ./config.lua:/app/config.lua:ro
      - ./data:/app/data
  redis:
    image: valkey/valkey:latest
    container_name: valkey
    restart: unless-stopped
