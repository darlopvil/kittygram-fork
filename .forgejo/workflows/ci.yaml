# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - "instances.json"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: codeberg-small
    steps:
      - name: Checkout repo
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          lfs: true

      - name: Install Buildah
        run: apt-get update && apt-get install buildah ca-certificates -y

      - name: Auth Codeberg registry
        run: buildah login --authfile=/tmp/auth.json --username=${{ secrets.REGISTRY_USER }} --password=${{ secrets.REGISTRY_TOKEN }} codeberg.org

      - name: Build and push image
        uses: https://codeberg.org/actions/buildah-simple@main
        with:
          tag: codeberg.org/${{ secrets.REGISTRY_USER }}/kittygram:latest
          context: .
          push: true
          authfile: /tmp/auth.json
