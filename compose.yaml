services:
  kittygram:
    image: kittygram:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kittygram
    ports:
      - 8080:80
    environment:
      - RESOLVER=10.89.2.1
    restart: unless-stopped
  redis:
    image: valkey/valkey:latest
    container_name: valkey
    restart: unless-stopped
