worker_processes ${{NUM_WORKERS}};
error_log stderr notice;
daemon off;
pid logs/nginx.pid;

env PORT;
env CODE_CACHE;
env ALLOW_JSON;
env RESOLVER;
env REDIS_HOST;
env REDIS_PORT;
env ENABLE_ATOM;
env BASE_ATOM_PATH;

events {
  worker_connections 1024;
}

http {
  include mime.types;
  lua_shared_dict web_state 5m;
  lua_package_path "./?/?.lua;./?/init.lua;;";

  init_by_lua_block {
    require "lpeg"
    require "lsqlite3"
    require "lua-utf8"
  }

  server {
    listen ${{PORT}};
    lua_code_cache ${{CODE_CACHE}};

    # The API answers CORS preflight requests itself (lib/api.lua).
    location /api/ {
      default_type text/html;
      content_by_lua_block {
        require("lapis").serve("app")
      }
    }

    location / {
      default_type text/html;
      # Pages only answer GET and HEAD, and Lapis answers an OPTIONS request
      # (sent by some feed readers before fetching a feed) with a 500.
      if ($request_method = OPTIONS) {
        add_header Allow "GET, HEAD, OPTIONS";
        return 204;
      }
      content_by_lua_block {
        require("lapis").serve("app")
      }
    }

    location /static/ {
      alias static/;
    }


    location /favicon.ico {
      alias static/favicon.ico;
    }

    resolver ${{RESOLVER}} ipv6=${{IPV6}} valid=30s;
    lua_ssl_verify_depth 2;
    lua_ssl_trusted_certificate ${{TRUSTED_CERTIFICATE}};
  }
}
